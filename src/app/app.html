<div class="app-layout">
  <!-- Top Navigation Header -->
  <app-header [healthStatus]="healthStatus()" />

  <!-- Mobile Segmented Navigation Bar (Visible only on mobile/small screens) -->
  <nav class="mobile-nav-bar" aria-label="Mobile workspace views">
    <button
      type="button"
      class="mobile-nav-item"
      [class.active]="activeMobileTab() === 'search'"
      (click)="setMobileTab('search')"
    >
      <span class="nav-icon">🔍</span>
      <span class="nav-text">Search</span>
      <span class="nav-badge">{{ searchResults().length }}</span>
    </button>

    <button
      type="button"
      class="mobile-nav-item"
      [class.active]="activeMobileTab() === 'clarify'"
      (click)="setMobileTab('clarify')"
    >
      <span class="nav-icon">💡</span>
      <span class="nav-text">Clarify</span>
      @if (activeClarify() || isClarifying()) {
        <span class="nav-dot-active" title="Clarify data active"></span>
      }
    </button>

    <button
      type="button"
      class="mobile-nav-item"
      [class.active]="activeMobileTab() === 'matrix'"
      (click)="setMobileTab('matrix')"
    >
      <span class="nav-icon">📊</span>
      <span class="nav-text">Case Matrix</span>
      <span class="nav-badge" [class.badge-active]="caseCount() > 0">{{ caseCount() }}</span>
    </button>
  </nav>

  <!-- Main Workspace Grid -->
  <main class="main-content">
    <!-- Left Column: Search & Rubric Explorer -->
    <section
      class="workspace-panel search-panel"
      [class.mobile-hidden]="activeMobileTab() !== 'search'"
      aria-label="Symptom Rubric Search and Results"
    >
      <div class="panel-header-bar">
        <div class="panel-title-group">
          <span class="panel-icon">🔍</span>
          <h2 class="panel-heading">Symptom Rubric Search</h2>
        </div>
      </div>

      <app-rubric-search [isSearching]="isSearching()" (searchTriggered)="executeSearch($event)" />

      <app-rubric-list
        [rubrics]="searchResults()"
        [isSearching]="isSearching()"
        [selectedIds]="selectedRubricIds()"
        (addRequested)="addRubricToCase($event)"
        (clarifyRequested)="openClarify($event)"
      />
    </section>

    <!-- Right Column: Clarify & Repertorization Analysis -->
    <div class="analysis-column" [class.mobile-hidden]="activeMobileTab() === 'search'">
      <!-- Clarifying Questions Panel -->
      @if (activeClarify() || isClarifying()) {
        <div class="clarify-wrapper" [class.mobile-hidden]="activeMobileTab() !== 'clarify'">
          <app-clarify-panel
            [clarifyData]="activeClarify()"
            [isClarifying]="isClarifying()"
            (closeRequested)="closeClarify()"
            (modalitySelected)="onModalitySelected($event)"
          />
        </div>
      } @else if (activeMobileTab() === 'clarify') {
        <div class="clarify-empty-mobile">
          <span class="empty-icon">💡</span>
          <h3>No Active Rubric Selected for Clarification</h3>
          <p>
            Go to the <strong>Search</strong> tab and tap <strong>"Clarify"</strong> on any rubric
            to analyze sub-modalities and view AI clinical interview questions.
          </p>
          <button type="button" class="btn-return-search" (click)="setMobileTab('search')">
            ← Return to Rubric Search
          </button>
        </div>
      }

      <!-- Deterministic Repertorization Matrix -->
      <div class="matrix-wrapper" [class.mobile-hidden]="activeMobileTab() !== 'matrix'">
        <app-repertorization-matrix />
      </div>
    </div>
  </main>
</div>
