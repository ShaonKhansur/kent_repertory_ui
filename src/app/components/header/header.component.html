<header class="app-header">
  <div class="header-brand">
    <div class="brand-icon">🌿</div>
    <div class="brand-text">
      <h1 class="brand-title">Kent's Repertory RAG</h1>
      <p class="brand-subtitle">Clinical Homeopathic Assistant • J.T. Kent (1,423 Pages)</p>
    </div>
  </div>

  <div class="header-actions">
    <!-- Production vs Local Mode Toggle Switcher -->
    <button
      type="button"
      class="mode-pill"
      [class.mode-production]="api.apiMode() === 'production'"
      [class.mode-local]="api.apiMode() === 'local'"
      (click)="toggleApiMode()"
      [title]="api.apiMode() === 'production' ? 'Connected to Render Cloud API. Click to switch to Local Dev.' : 'Connected to Local Dev API (Port 3000). Click to switch to Render Cloud.'"
    >
      @if (api.apiMode() === 'production') {
        <span class="mode-icon">☁️</span>
        <span class="mode-label">Cloud API</span>
        <span class="mode-tag">Render</span>
      } @else {
        <span class="mode-icon">💻</span>
        <span class="mode-label">Local API</span>
        <span class="mode-tag">:3000</span>
      }
    </button>

    <!-- Live AI Backend Health Status -->
    @if (healthStatus(); as status) {
      <div
        class="status-pill status-healthy"
        [title]="'Backend Online • 60,570 rubrics indexed • Supabase pgvector'"
      >
        <span class="status-dot"></span>
        <span class="status-text">Online</span>
        <span class="status-divider">•</span>
        <span class="status-model">
          {{ status.supabase?.total_rubrics || status.dataset?.total_rubrics || 60570 | number }} rubrics
        </span>
      </div>
    } @else {
      <div
        class="status-pill status-offline"
        [title]="'Connecting to ' + (api.apiMode() === 'production' ? 'Render Cloud' : 'http://localhost:3000')"
      >
        <span class="status-dot pulse"></span>
        <span class="status-text">Connecting...</span>
      </div>
    }

    <!-- Theme Switcher Toggler -->
    <button
      type="button"
      class="theme-toggle-btn"
      (click)="toggleTheme()"
      [title]="themeService.isDark() ? 'Switch to Light Theme' : 'Switch to Dark Theme'"
      aria-label="Toggle visual theme"
    >
      @if (themeService.isDark()) {
        <svg
          class="theme-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <span class="theme-label">Light</span>
      } @else {
        <svg
          class="theme-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
        <span class="theme-label">Dark</span>
      }
    </button>

    <!-- Swagger Docs Link (Dynamic to Active API) -->
    <a
      [href]="api.docsUrl()"
      target="_blank"
      rel="noopener noreferrer"
      class="docs-link"
      title="Open Swagger API Explorer for active backend"
    >
      <span>Swagger Docs</span>
      <svg
        width="13"
        height="13"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
        <polyline points="15 3 21 3 21 9"></polyline>
        <line x1="10" y1="14" x2="21" y2="3"></line>
      </svg>
    </a>
  </div>
</header>
